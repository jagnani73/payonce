name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The deploy job runs only on main, and only once the repository variables exist.
      DEPLOYS: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PAYONCE_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:layers
      - run: pnpm test
      - run: pnpm build:web
      - name: Package the release
        if: env.DEPLOYS == 'true'
        run: |
          git archive --format=tar --output=release.tar HEAD src scripts fixtures deploy package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json
          tar --append --file=release.tar web/dist
          gzip -9 release.tar
      - if: env.DEPLOYS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PAYONCE_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: payonce-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      SHA: ${{ github.sha }}
      BUCKET: ${{ vars.PAYONCE_RELEASE_BUCKET }}
      INSTANCE: ${{ vars.PAYONCE_INSTANCE_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PAYONCE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.PAYONCE_AWS_REGION }}
          role-session-name: payonce-deploy-${{ github.run_id }}
          role-duration-seconds: 1800
          role-skip-session-tagging: true
      - name: Upload the release
        run: aws s3 cp release.tar.gz "s3://$BUCKET/releases/$SHA.tar.gz" --only-show-errors
      - name: Deploy it on the instance
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name PayOnce-Deploy \
            --parameters "sha=$SHA" --timeout-seconds 120 --comment "PayOnce ${SHA:0:12}" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          status=Pending
          deadline=$((SECONDS + 1080))
          while (( SECONDS < deadline )); do
            sleep 10
            if ! answer=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>&1); then
              grep -q InvocationDoesNotExist <<<"$answer" && continue
              echo "$answer" >&2
              exit 1
            fi
            status=$answer
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Deploy of ${SHA:0:12}: $status"
          test "$status" = Success
