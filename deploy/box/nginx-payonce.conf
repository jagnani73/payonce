# PayOnce behind CloudFront. The security group lets only CloudFront reach port
# 80, and only requests that carry the distribution's origin header reach the app.
server_tokens off;

# One visitor is the address CloudFront saw, without its port.
map $http_cloudfront_viewer_address $payonce_viewer {
    "~^(?<address>.+):[0-9]+$" $address;
    default $http_cloudfront_viewer_address;
}
map $request_method $payonce_writer {
    GET "";
    HEAD "";
    default $payonce_viewer;
}
limit_req_zone $payonce_viewer zone=payonce_reads:10m rate=20r/s;
limit_req_zone $payonce_writer zone=payonce_writes:10m rate=30r/m;

server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/payonce-origin.conf;

    limit_req_status 429;
    # The app takes an email upload of up to 3 MB and refuses a slower body after 30 s.
    client_max_body_size 3m;
    client_body_timeout 30s;
    gzip_proxied any;
    gzip_types application/json text/css text/javascript image/svg+xml;

    location / {
        limit_req zone=payonce_reads burst=100 nodelay;
        limit_req zone=payonce_writes burst=20 nodelay;
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Origin-Verify "";
        proxy_read_timeout 90s;
    }
}
